name: Build APK

# Roda só quando você clicar em "Run workflow" (aba Actions).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Montar o site dentro do app (pasta www)
        run: |
          mkdir -p www assets
          cp index.html www/
          for f in manifest.json firebase-config.js app-config.js icon-192.png icon-512.png; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          # dentro do app não precisa de service worker
          sed -i "/serviceWorker/d" www/index.html
          cp icon-only.png icon-foreground.png icon-background.png assets/

      - name: Criar o projeto Android
        run: |
          npm install
          npx cap add android

      - name: Permissões de localização e barra de status
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <application#' "$M"
          grep -n "uses-permission" "$M"
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item>\n        <item name="android:windowLightStatusBar">false</item>#' "$S"

      - name: Ícone do app
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android

      - name: Chave de assinatura fixa (permite atualizar sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ORmaps-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ORmaps.apk
          gh release create "apk-${{ github.run_number }}" ORmaps.apk \
            --title "ORmaps (build ${{ github.run_number }})" \
            --notes "APK para instalar no Android."
